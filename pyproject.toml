[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dserver-notification-plugin"
description = "dserver plugin for receiving s3 notifications on updated objects."
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de"},
    {name = "Johannes L. Hörmann", email = "johannes.laurin@gmail.com"},
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "dtoolcore>=3.18.0",
    "dtool-s3",
    "dservercore>0.18.0",
]

[project.optional-dependencies]
test = [
    "dservercore",
    "dserver-retrieve-plugin-mongo",
    "dserver-search-plugin-mongo",
    "pytest",
    "pytest-cov",
]

[project.urls]
Documentation = "https://dserver-notification-plugin.readthedocs.io"
Repository = "https://github.com/jic-dtool/dserver-notification-plugin"
Changelog = "https://github.com/jic-dtool/dserver-notification-plugin/blob/main/CHANGELOG.rst"

[project.entry-points."dservercore.extension"]
NotificationExtension = "dserver_notification_plugin:NotificationExtension"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "dserver_notification_plugin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dserver_notification_plugin"]

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dserver_notification_plugin --cov-report=term-missing"
